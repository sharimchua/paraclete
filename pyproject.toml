[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "paraclete"
version = "0.2.0"
description = "Lightweight file-based Open Knowledge Format (OKF) practice OS for practitioners and Obsidian"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pyyaml>=6.0",
    "jinja2>=3.1.0"
]

[project.scripts]
paraclete = "paraclete.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
